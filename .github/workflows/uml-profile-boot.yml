# SPDX-License-Identifier: GPL-2.0
#
# GitHub Actions CI for workstream C-01 profile defconfigs.
#
# Build-only guard: for each matrix profile, run
# `make ARCH=um uml/<profile>` to merge the fragment with the
# base defconfig, then `make -j` to build vmlinux + linux, and
# assert the resulting binary exists and is non-empty. A runtime
# boot validator exists in-tree
# (`tools/testing/selftests/um/profiles/run-profile-checks.sh`)
# and runs well locally, but UML boot under GHA's runner image
# turns out to have a diagnostic-opaque early-exit that is not
# worth chasing as a CI blocker — kernel prints "VFS: Mounted
# root (hostfs)" and the UML process exits 0 before
# `run_init_process()` prints its "Run /path/to/init as init
# process" line, with no panic and no `/dev/kmsg` breadcrumb
# reaching stdout. Leave the validator as in-tree tooling for
# developer workflows; the CI job catches the regressions that
# matter most: profile fragments that reference options that
# no longer exist, kconfig merges that produce invalid
# `.config`s, or common-option changes that break any profile's
# build.
#
# Fork-only workflow (kernel tree's top-level `.gitignore`
# excludes dotfiles, so this ships via `git add -f`).
#
# Matrix choice: `prod-fast`, `sandbox`, `embedded` —
#   - `prod-fast`     the "production-lean" baseline every
#                     other profile is measured against;
#                     fastest build (no sanitizers, no KCSAN).
#   - `sandbox`       the most-restrictive profile (all debug
#                     off, proc_kcore off); validates the
#                     "minimum-TCB" path that fuzz / research
#                     profiles rely on as a subtractive baseline.
#   - `embedded`      ptrace backend variant; exercises a
#                     different UML host code path than the
#                     seccomp-backend default in prod-fast.
#
# The heavier profiles (`fuzz-deep`, `research`, `race`) are
# intentionally out of this matrix — their KASAN + KCSAN
# surface roughly doubles build time, which would push every
# PR past the point reviewers tolerate. They stay in the
# harness for local `make run_tests` runs.

name: uml profile build

on:
  push:
    branches: [uml-redesign-plan]
    paths:
      - 'arch/um/**'
      - 'arch/x86/um/**'
      - 'tools/testing/selftests/um/profiles/**'
      - '.github/workflows/uml-profile-boot.yml'
  pull_request:
    paths:
      - 'arch/um/**'
      - 'arch/x86/um/**'
      - 'tools/testing/selftests/um/profiles/**'
      - '.github/workflows/uml-profile-boot.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.profile }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      # One profile failure shouldn't mask the others — a
      # sandbox regression and an embedded regression often
      # share a root cause and we want to see both signals.
      fail-fast: false
      matrix:
        profile: [prod-fast, sandbox, embedded]

    steps:
      - uses: actions/checkout@v4

      # Ubuntu runners ship most of this but flex + bison +
      # libelf-dev are not always pre-installed on minimal
      # variants. The rest are cheap to assert for safety.
      - name: Install kernel-build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc \
            bison \
            build-essential \
            flex \
            libelf-dev \
            libssl-dev \
            pahole

      # Cache the per-profile O= directory. Keyed on the files
      # that can change the build: the profile fragment itself,
      # the base defconfig, the top-level Makefile (version
      # bumps invalidate everything), and any arch/um changes.
      # Warm cache: incremental builds take 1–3 min; cold:
      # 8–12 min.
      - name: Cache build output (O=/tmp/uml-profile-${{ matrix.profile }})
        uses: actions/cache@v4
        with:
          path: /tmp/uml-profile-${{ matrix.profile }}
          key: uml-profile-${{ matrix.profile }}-${{ runner.os }}-${{ hashFiles('arch/um/configs/base_defconfig', format('arch/um/configs/profiles/{0}.config', matrix.profile), 'Makefile', 'arch/um/**/*.c', 'arch/um/**/*.h', 'arch/x86/um/**/*.c', 'arch/x86/um/**/*.h') }}
          restore-keys: |
            uml-profile-${{ matrix.profile }}-${{ runner.os }}-

      - name: Configure profile (.config)
        run: make ARCH=um O=/tmp/uml-profile-${{ matrix.profile }} uml/${{ matrix.profile }}

      - name: Build vmlinux + linux
        run: |
          make ARCH=um O=/tmp/uml-profile-${{ matrix.profile }} \
               -j$(nproc) vmlinux linux

      # The build target produces `linux` as a hardlink to
      # vmlinux; both must exist and have nonzero size. A broken
      # link step or an out-of-disk at `--link vmlinux` would
      # otherwise leave the step "successful" but with no
      # binary to run.
      - name: Assert binary is present and non-empty
        run: |
          BIN=/tmp/uml-profile-${{ matrix.profile }}/linux
          VMLINUX=/tmp/uml-profile-${{ matrix.profile }}/vmlinux
          test -x "$BIN"     || { echo "::error::$BIN missing"; exit 1; }
          test -x "$VMLINUX" || { echo "::error::$VMLINUX missing"; exit 1; }
          test -s "$BIN"     || { echo "::error::$BIN is empty"; exit 1; }
          echo "binary size: $(stat -c %s "$BIN") bytes"

      # Confirm the merged .config honored the fragment. Each
      # profile has at least one CONFIG_* that distinguishes it
      # from the base. We grep for those here — a missing grep
      # hit means the fragment was silently ignored (typically
      # because it names options whose dependencies no longer
      # hold after a common-option change somewhere else).
      - name: Assert fragment applied
        run: |
          CFG=/tmp/uml-profile-${{ matrix.profile }}/.config
          test -s "$CFG" || { echo "::error::$CFG empty"; exit 1; }
          case "${{ matrix.profile }}" in
            prod-fast)
              grep -q '^CONFIG_UM_BACKEND_DYNAMIC=y' "$CFG" \
                || { echo "::error::prod-fast fragment not applied (UM_BACKEND_DYNAMIC expected y)"; exit 1; } ;;
            sandbox)
              grep -q '^CONFIG_UM_BACKEND_SECCOMP_ONLY=y' "$CFG" \
                || { echo "::error::sandbox fragment not applied (UM_BACKEND_SECCOMP_ONLY expected y)"; exit 1; }
              grep -q '^# CONFIG_PROC_KCORE is not set' "$CFG" \
                || { echo "::error::sandbox fragment not applied (PROC_KCORE expected off)"; exit 1; } ;;
            embedded)
              grep -q '^CONFIG_UM_BACKEND_PTRACE_ONLY=y' "$CFG" \
                || { echo "::error::embedded fragment not applied (UM_BACKEND_PTRACE_ONLY expected y)"; exit 1; } ;;
          esac

      # --- UML boot smoke test -----------------------------------
      #
      # Ubuntu 24.04 GHA runners default to
      # `kernel.apparmor_restrict_unprivileged_userns=1`, which
      # blocks the unprivileged user-namespace operations UML's
      # child-process model needs at init-exec time. That's the
      # same restriction that breaks bubblewrap / nested podman
      # on these runners; see
      # https://github.com/actions/runner-images/issues/12096 and
      # https://github.com/chainguard-dev/melange/issues/1508 for
      # the general pattern. Lifting it before UML launches lets
      # the `/bin/true` init actually run, which is the smallest
      # possible "boot-to-userspace" signal.
      - name: Lift unprivileged-userns AppArmor restriction
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # Statically-linked init rules out hostfs dynamic-loader
      # path problems. busybox-static ships a single-file
      # binary with no .so deps — if this runs, the execve path
      # works through hostfs; if not, the problem is below the
      # libc layer (kernel exec, binfmt, or UML's stub-process
      # model).
      - name: Install busybox-static
        run: sudo apt-get install -y --no-install-recommends busybox-static

      # Boot with `init=/bin/busybox`. busybox with no args
      # prints its usage and exits 1; the kernel then panics
      # with `Kernel panic - not syncing: Attempted to kill
      # init!` (see init/main.c:try_to_run_init_process). That
      # panic line in the captured output is the strongest
      # "UML successfully booted to userspace and exec'd init"
      # signal reachable without a real rootfs.
      #
      # `panic=-1` makes the kernel exit the UML host process
      # immediately on panic, rather than hanging — necessary
      # because `panic=0` loops forever and would always hit
      # the outer `timeout`.
      #
      # Exit code + post-mortem dmesg are captured so a crash
      # in UML's host-side stub (SIGSEGV → core dumped, which
      # is what we've seen on `/bin/true` with glibc) has
      # concrete diagnostic context rather than a bare
      # "monitored command dumped core" line.
      - name: Boot smoke test (init=/bin/busybox)
        run: |
          BIN=/tmp/uml-profile-${{ matrix.profile }}/linux
          set +e
          out=$(timeout 30 "$BIN" init=/bin/busybox mem=256M \
                  con=fd:0,fd:1 ssl=null \
                  root=/dev/root rootfstype=hostfs rw \
                  panic=-1 loglevel=7 2>&1)
          rc=$?
          set -e
          echo "UML exit code: $rc"
          echo "---- UML output (last 80 lines) ----"
          echo "$out" | tail -80
          echo "---- host dmesg tail ----"
          sudo dmesg | tail -40 || true
          echo "---- UML binary linkage ----"
          file "$BIN" || true
          if echo "$out" | grep -qE 'Attempted to kill init|Kernel panic'; then
            echo "::notice::UML booted to userspace and exec'd init"
            exit 0
          fi
          case "$rc" in
            124) echo "::error::UML timed out — kernel hung before init exec" ;;
            139) echo "::error::UML crashed with SIGSEGV during init-exec stub setup" ;;
              *) echo "::error::UML exited rc=$rc with no init-exec panic" ;;
          esac
          exit 1
