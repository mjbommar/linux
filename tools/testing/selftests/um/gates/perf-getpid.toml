#
# getpid() round-trip perf gate.
#
# Wraps run-perf-getpid.sh, which boots UML with a tight getpid()
# loop as init=, captures cyc_per_call from the in-guest output line,
# and computes the kvm:seccomp ratio. The harness already enforces
# its own MAX_KVM_RATIO ceiling and exits non-zero on regression; we
# pass that exit code through and additionally extract the ratio for
# trend tracking in the scoreboard.
#
# Note: this gate measures the v1 KVM (gadget/integrated) backend,
# NOT v2. v2 perf measurement uses a different harness (Python
# startup). Kept here so the launcher can still bisect v1 perf
# regressions.

schema_version = 1

[gate]
name = "perf-getpid"
description = "getpid() round-trip ratio kvm:seccomp"
phase = "performance"

[run]
cmd = "bash tools/testing/selftests/um/perf-getpid/run-perf-getpid.sh"
budget_sec = 180

[run.env]
UML_BINARY = "{{kernel}}"
# Backend list is fixed for this harness; {{backend}} is informational
# only (the harness measures all three).
BACKENDS = "ptrace seccomp kvm"
# Default ceiling: kvm cyc_per_call <= 2.5x seccomp's. Set MAX_KVM_RATIO=0
# to skip the gate and just record numbers.
MAX_KVM_RATIO = "2.5"

[parse]
pass_on_exit_zero = true

# Trend metrics: captured into scoreboard.row.metrics.
[[parse.metrics]]
name  = "kvm_cyc"
regex = "kvm_cyc=([0-9]+)"
[[parse.metrics]]
name  = "seccomp_cyc"
regex = "seccomp_cyc=([0-9]+)"
[[parse.metrics]]
name  = "ratio_kvm_over_seccomp"
regex = "ratio_kvm_over_seccomp=([0-9.]+)"

[thresholds]
require_clean_exit = true
