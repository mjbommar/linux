# SPDX-License-Identifier: GPL-2.0
#
# cpython-tier0: minimal CPython parity gate.
#
# Boots UML with `init=python3 -m cpython-tier0`, runs the curated
# tier-0 sweep (hashlib + numerics + containers + regex + strings +
# typing). The gate guards against backend regressions in the form
# "Python's C-extension dlopen path silently corrupts user memory."
# Hashlib alone catches the dlopen+libcrypto path; the wider tier-0
# list catches anything else along the common single-process Python
# paths.
#
# This is a HEAVY workload (single python process, but exercises
# substantial libc + libcrypto + zlib + ssl).
#
# The gate should pass on kvm-v2; a failure here means Python's
# C-extension import path is not safe enough for the wider parity
# suite.

schema_version = 1

[gate]
name = "cpython-tier0"
description = "CPython tier-0 parity (hashlib + numerics + containers + regex + strings + typing)"
phase = "python"

[run]
cmd = "bash tools/testing/selftests/um/cpython-tier0/run-cpython-tier0.sh"
budget_sec = 120

[run.env]
UML_BINARY              = "{{kernel}}"
CPYTHON_TIER0_BACKEND   = "{{backend}}"

[parse]
pass_on_exit_zero = true

[[parse.metrics]]
name  = "hashlib_sha256_emptystring"
regex = "hashlib sha256 ok = ([0-9a-f]+)"

[thresholds]
require_clean_exit = true
