# SPDX-License-Identifier: GPL-2.0
#
# Full substrate gate (class-a-env + class-b-process +
# class-c-syscall + class-d-structural).
#
# Wraps run-regrtest-repros.sh, which boots a UML kernel with the
# repro harness as init=, walks every per-class runner, and emits one
# `REPRO: <name> PASS|FAIL|EXPECTED_FAIL` line per test plus a
# SUMMARY trailer. We count from the per-test lines so a single
# missing-summary doesn't silently zero the gate.
#
# Backend selection: {{backend}} flows into the harness's BACKEND
# env, which forwards it as `backend=force=<name>` on the cmdline.
# {{kernel}} is the absolute path to the UML kernel binary.
#
# Thresholds reflect the CURRENT LINE, not a target.
#   - seccomp: PASS=25 FAIL=3 EXPECTED_FAIL=3
#   - kvm-v2:  PASS=27 FAIL=3 EXPECTED_FAIL=1
# A single threshold pair has to cover both backends, so we set the
# floor at the WORSE backend's current PASS count and the ceiling at
# the shared known-fail tolerance.
#
# Loosening either threshold requires an explicit reason. Tightening
# as v2 catches up to seccomp is just progress; bump min_pass.

schema_version = 1

[gate]
name = "regrtest-substrate"
description = "Substrate gate: all 4 reproducer classes via run-regrtest-repros.sh"
phase = "substrate"

[run]
cmd = "bash tools/testing/selftests/um/regrtest-repros/run-regrtest-repros.sh"
budget_sec = 240

[run.env]
UML_BINARY = "{{kernel}}"
BACKEND    = "{{backend}}"
TIMEOUT    = "120"
# VERBOSE=1 dumps the entire kernel boot log alongside REPRO: lines;
# default off so the parse layer only sees PASS/FAIL/EXPECTED_FAIL
# markers. Set VERBOSE=1 ad-hoc when debugging a specific run.

[parse]
pass_regex          = "^REPRO: \\S+ PASS"
fail_regex          = "^REPRO: \\S+ FAIL"
expected_fail_regex = "^REPRO: \\S+ EXPECTED_FAIL"

[thresholds]
# Current worst-backend floor: seccomp reports 25 PASS and kvm-v2
# reports 27 PASS on the same repro set. Any drop below 25 is a
# substrate regression.
min_pass  = 25
# Both backends still report the same three ordinary failures in
# class-a-env; the gate remains strict about not growing that set.
max_fail  = 3
# The harness exits 1 whenever FAIL>0; that's already captured by
# max_fail. A boot-level failure (kernel panic, OOM) still shows up
# as pass=0 which fails min_pass.
require_clean_exit = false
