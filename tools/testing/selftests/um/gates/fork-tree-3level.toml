# SPDX-License-Identifier: GPL-2.0
#
# Minimal reproducer for the v2 "shell sees rc=255 after
# fork-tree-3level child reap" bug. This is a smaller, more
# specific gate than regrtest-substrate; it isolates the exact
# shape that causes the substrate gate's truncation: fork_exec_wait
# and multi-import Python both
# include a 3-level fork tree with a wait at the middle layer.
#
# Goal state: this must PASS on both backends. Tightening this gate
# to PASS on kvm-v2 is the concrete deliverable for closing the
# fork-state leak family.

schema_version = 1

[gate]
name = "fork-tree-3level"
description = "3-level fork tree with middle wait - minimal repro for v2 fork-state-leak family"
phase = "E.4"

[run]
cmd = "bash tools/testing/selftests/um/fork-tree-3level/run-fork-tree-3level.sh"
budget_sec = 60

[run.env]
UML_BINARY = "{{kernel}}"
BACKEND    = "{{backend}}"

[parse]
pass_regex = "^FORK_TREE_3LEVEL: backend=\\S+ PASS"
fail_regex = "^FORK_TREE_3LEVEL: backend=\\S+ FAIL"

[thresholds]
# Goal state: both backends pass (one PASS line per invocation).
# This must hit min_pass=1 max_fail=0 on both backends.
min_pass  = 1
max_fail  = 0
require_clean_exit = true
