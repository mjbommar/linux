# umlbuild profile — "sandbox-net-v2": sandbox-net + vector v2 driver.
#
# Same Alpine rootfs + outbound networking as sandbox-net, but uses
# CONFIG_UML_NET_VECTOR_V2 (the new runtime skeleton) instead of the
# legacy CONFIG_UML_NET_VECTOR.  Guest sees `vec2.0` instead of `vec0`.
#
# V2 is more current architecture (per-CPU queues, vhost-style descriptor
# rings, sandbox-vs-inproc mode split) but is marked experimental in
# Kconfig.  For most workloads sandbox-net (v1) is the stable choice;
# use sandbox-net-v2 to dogfood the new driver against real traffic.
#
# Inproc mode lets the kernel open the host TAP by ifname directly.
# Sandbox mode (the v2 default when INPROC is off) requires the
# launcher to pre-open the TAP fd; that path isn't wired into umlbuild
# shell yet.

schema_version = 1

[profile]
name        = "sandbox-net-v2"
description = "Sandbox + outbound networking via CONFIG_UML_NET_VECTOR_V2 (inproc)."

[kernel]
base_config = "tinyconfig"
enable = [
    # --- mvp baseline ---
    "64BIT",
    "PRINTK",
    "NULL_CHAN",
    "HOSTFS",
    "BINFMT_ELF",
    "BINFMT_SCRIPT",
    "PROC_FS",
    "UM_WORKER_PROCESS",
    "STDERR_CONSOLE",
    "FUTEX",
    "BLOCK",
    "BLK_DEV_UBD",
    "EXT4_FS",
    "JBD2",
    "DEVTMPFS",
    "DEVTMPFS_MOUNT",
    "TMPFS",
    "SHMEM",
    "UNIX98_PTYS",
    "DEVPTS_FS",
    # --- sandbox additions: loopback networking + overlay ---
    "NET",
    "INET",
    "UNIX",
    "PACKET",
    "OVERLAY_FS",
    "HW_RANDOM",
    "EVENTFD",
    "TIMERFD",
    "SIGNALFD",
    "EPOLL",
    # --- net additions: vector v2 driver + IP stack ---
    "UML_NET",
    # NOTE: v2 doesn't subsume v1; both can coexist but only one
    # owns the cmdline `vec*` token.  Keep v1 OFF so vec2.0 wins.
    "UML_NET_VECTOR_V2",
    "UML_NET_VECTOR_V2_INPROC",  # lets the kernel open the TAP by ifname
    "NETDEVICES",
    "NET_CORE",
    "IP_PNP",
    "INET_DIAG",
    "TCP_CONG_CUBIC",
    "IP_MULTICAST",
]
disable = [
    # We explicitly want v2; disable v1 so they don't fight over /dev/net.
    "UML_NET_VECTOR",
]
strip = true

[rootfs]
base         = "alpine"
sandbox_uid  = 0

[rootfs.alpine]
version  = "3.20.3"
sha256   = "d4e6fd67dcf75e40c451560ac7265166c2b72a0f38ddc9aae756a7de3d1efa0c"
mirror   = "https://dl-cdn.alpinelinux.org/alpine"
packages = [
    "python3",
    "py3-pip",
    "busybox-extras",
    "ca-certificates",
    "iproute2",
    "curl",
]

[image]
size   = "500M"
fstype = "ext4"
label  = "uml-sandbox-net-v2"

[instance]
mem         = "512M"
ncpus       = 1
backend     = "seccomp"
sandbox_cmd = "echo '--- vec2.0 ---'; ip -br addr show vec2.0; echo; echo '--- urlopen ---'; python3 -c 'import urllib.request; print(urllib.request.urlopen(\"https://www.python.org/\", timeout=8).read(60))'"

[network]
mode     = "tap"
driver   = "vector2"            # vector v2 — guest device will be vec2.0
tap_name = "umlb-tap0"
host_ip  = "10.7.0.1/24"
guest_ip = "10.7.0.2/24"
gateway  = "10.7.0.1"
dns      = ["1.1.1.1", "8.8.8.8"]
