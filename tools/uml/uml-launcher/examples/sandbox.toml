# umlctl Umlfile for the sandbox profile.
#
# Pair with a kernel built from `make ARCH=um uml/sandbox`. The kernel profile
# tightens the guest config; host isolation still comes from explicit launcher
# and backend controls such as vector2 fd handoff, seccomp, cgroups, and LSM
# policy.

schema_version = 1

[instance]
name = "uml-sandbox"
labels = { profile = "sandbox", purpose = "sandbox-profile" }

[kernel]
path = "${UML_KERNEL}"
backend = "seccomp"
append = []

[runtime]
mem = "256M"
ncpus = 1
root = "hostfs"

[network]
mode = "none"

[[init.phases]]
name = "shell"
cmd = "exec /bin/sh -i"

[debug]
strace = false
gdb = false
log_dir = ""
keep_running_on_failure = true
