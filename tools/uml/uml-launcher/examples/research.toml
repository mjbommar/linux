# umlctl Umlfile for the research profile.
#
# The research profile enables debug and introspection facilities such as
# KASAN, KFENCE, ftrace, kprobes, and BPF JIT. Run with --foreground for an
# interactive shell:
#
#   UML_KERNEL=/tmp/uml-research/linux \
#     umlctl up -f tools/uml/uml-launcher/examples/research.toml --foreground

schema_version = 1

[instance]
name = "uml-research"
labels = { profile = "research", purpose = "debugging" }

[kernel]
path = "${UML_KERNEL}"
backend = "seccomp"
append = []

[runtime]
mem = "512M"
ncpus = 1
root = "hostfs"

[network]
mode = "none"

[[init.phases]]
name = "shell"
cmd = "exec /bin/sh -i"

[debug]
strace = false
gdb = false
log_dir = ""
keep_running_on_failure = true
