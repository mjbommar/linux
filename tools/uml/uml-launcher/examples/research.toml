# uml-launcher config for the research profile.
#
# The research profile turns on the debug + introspection stack —
# KASAN, KFENCE, ftrace, kprobes, BPF JIT — for hands-on kernel
# feature work. KCOV is intentionally OFF in this profile (see
# the D31 rationale and arch/um/configs/profiles/research.config
# comments); use uml/fuzz or uml/fuzz-deep when you need KCOV.
# Slower boot than fuzz; not appropriate for production.
#
# Pair this with:
#   make ARCH=um uml/research
#   make ARCH=um O=/tmp/uml-research -j$(nproc)
#
# Invoke interactively:
#   uml-launcher -v run --config ~/.config/uml-launcher/research.toml

kernel = "/tmp/uml-research/linux"
init   = "/bin/sh"
mem    = "512M"
root   = "hostfs"
console = "stdio"
