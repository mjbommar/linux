# umlctl Umlfile - vector2 fd multiqueue smoke.
#
# This is the recommended shape for exercising vector2 queue scaling:
# umlctl creates one multiqueue TAP, opens one launcher-owned TAP fd
# per queue, and passes the contiguous fd range 200..203 to vector2.
#
# Usage:
#   UML_KERNEL=/path/to/uml/linux \
#     umlctl up -f tools/uml/uml-launcher/examples/vector2-fd-multiqueue.toml \
#       --wait-for VECTOR2_FD_MULTIQUEUE_OK
#
# Inspect first:
#   UML_KERNEL=/path/to/uml/linux \
#     umlctl up -f tools/uml/uml-launcher/examples/vector2-fd-multiqueue.toml --dry-run
#
# Tear down:
#   umlctl down -f tools/uml/uml-launcher/examples/vector2-fd-multiqueue.toml --rm

schema_version = 1

[instance]
name = "vector2-fd-multiqueue"
labels = { service = "network-smoke", driver = "vector2", transport = "fd", queues = "4" }

[kernel]
path = "${UML_KERNEL}"
backend = "seccomp"
append = []

[runtime]
mem = "512M"
ncpus = 4

[network]
mode = "tap"
driver = "vector2"
host_mode = "auto"
queues = 4
tap_name = "v2fdmq0"
guest_ip = "10.89.0.2/24"
host_ip = "10.89.0.1/24"
gateway = "10.89.0.1"
nameservers = ["8.8.8.8", "1.1.1.1"]
masquerade_via = "auto"
ports = []

[env]
PATH = "/usr/bin:/bin:/sbin:/usr/sbin"

[[init.phases]]
name = "network-metadata"
cmd = "env | grep '^UMLCTL_NETWORK_' | sort; echo UMLCTL_NETDEV=$UMLCTL_NETDEV"

[[init.phases]]
name = "link"
cmd = "ip -d link show \"$UMLCTL_NETDEV\"; ip addr show \"$UMLCTL_NETDEV\""

[[init.phases]]
name = "gateway"
cmd = "ping -c 3 \"$UMLCTL_GATEWAY\""
timeout_secs = 20

[[init.phases]]
name = "stats"
cmd = "command -v ethtool >/dev/null 2>&1 && ethtool -S \"$UMLCTL_NETDEV\" || true"

[[init.phases]]
name = "ready"
cmd = "echo VECTOR2_FD_MULTIQUEUE_OK"

[debug]
strace = false
gdb = false
gdb_port = 5678
log_dir = ""
keep_running_on_failure = false
