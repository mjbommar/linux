schema_version = 1

[instance]
name = "tls-test"
labels = { workload = "tls-test" }

[kernel]
path = "${UML_KERNEL}"
backend = "seccomp"
append = []

[runtime]
mem = "512M"
ncpus = 2

[network]
mode = "none"

[env]
TMPDIR = "/tmp"

[[init.phases]]
name = "write-source"
cmd = """
cat > /tmp/tls_test.c << 'EOFCEOF'
#include <pthread.h>
#include <stdio.h>
#include <stdlib.h>
#include <string.h>
#include <stdint.h>
#include <unistd.h>

static __thread uint64_t tls_slot = 0xdeadbeefcafebabeULL;
static __thread uint64_t tls_zero_slot = 0;

#define ASSERT(cond, msg) do { \\
    if (!(cond)) { \\
        fprintf(stderr, "FAIL: %s (line %d): %s [got tls_slot=0x%016lx tls_zero_slot=0x%016lx]\\n", \\
                msg, __LINE__, #cond, tls_slot, tls_zero_slot); \\
        exit(1); \\
    } \\
} while (0)

static void *worker(void *arg) {
    uint64_t id = (uint64_t)(uintptr_t)arg;
    ASSERT(tls_slot == 0xdeadbeefcafebabeULL, "fresh-thread .tdata template");
    ASSERT(tls_zero_slot == 0, "fresh-thread .tbss zero-init");
    tls_slot = 0xa1b2c3d40000000ULL | id;
    tls_zero_slot = 0xfeedface00000000ULL | id;
    for (int i = 0; i < 1000; i++) getpid();
    for (int i = 0; i < 100; i++) sched_yield();
    ASSERT(tls_slot == (0xa1b2c3d40000000ULL | id),
           "my own TLS write persists across many syscalls + yields");
    ASSERT(tls_zero_slot == (0xfeedface00000000ULL | id),
           "my own .tbss write persists");
    return NULL;
}

int main(void) {
    ASSERT(tls_slot == 0xdeadbeefcafebabeULL, "main thread .tdata template");
    ASSERT(tls_zero_slot == 0, "main thread .tbss zero-init");
    tls_slot = 0x11111111aaaaaaaaULL;
    tls_zero_slot = 0x2222222200000000ULL;
    const int N = 32;
    pthread_t threads[N];
    for (int i = 0; i < N; i++) {
        if (pthread_create(&threads[i], NULL, worker, (void *)(uintptr_t)(i + 1)) != 0) {
            perror("pthread_create");
            return 1;
        }
    }
    for (int i = 0; i < N; i++) pthread_join(threads[i], NULL);
    ASSERT(tls_slot == 0x11111111aaaaaaaaULL,
           "main thread TLS survives N other threads' lifecycle");
    ASSERT(tls_zero_slot == 0x2222222200000000ULL,
           "main thread .tbss survives ditto");
    printf("PASS: %d threads + main, all TLS reads/writes correct\\n", N);
    return 0;
}
EOFCEOF
ls -la /tmp/tls_test.c
"""

[[init.phases]]
name = "compile"
cmd = """
gcc -O2 -pthread -o /tmp/tls_test /tmp/tls_test.c 2>&1
ls -la /tmp/tls_test
"""

[[init.phases]]
name = "run-tls-test"
cmd = """
echo '=== UML seccomp: __thread TLS test ==='
/tmp/tls_test
echo "uml exit: $?"
"""

[[init.phases]]
name = "report"
cmd = "echo TLS_TEST_DONE"

[debug]
strace = false
gdb = false
log_dir = ""
keep_running_on_failure = false
