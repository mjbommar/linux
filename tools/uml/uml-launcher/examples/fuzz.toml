# uml-launcher config for the fuzz profile.
#
# Pair this with:
#   make ARCH=um uml/fuzz
#   make ARCH=um O=/tmp/uml-fuzz -j$(nproc)
#
# The fuzz profile selects CONFIG_UM_SNAPSHOT_FORKSERVER=y so the
# kernel speaks the AFL-compatible 12-byte wire protocol on fds
# 198/199 when a harness plumbs them in.
#
# Invoke:
#   # Fuzzer opens its pipes, hands the fds to the launcher:
#   exec 3<>/path/to/ctl  4<>/path/to/status
#   uml-launcher run --config ~/.config/uml-launcher/fuzz.toml \
#                    --forkserver 3,4
#
# --forkserver must be a CLI flag, not a TOML field, because the
# fd numbers are per-invocation. Everything else lives here.

kernel = "/tmp/uml-fuzz/linux"
init   = "/usr/local/bin/fuzz-ready.sh"
mem    = "128M"
root   = "hostfs"
console = "null"

# Appended verbatim to the synthesized UML command-line.
# append  = ["quiet"]
