# umlctl Umlfile for fuzz-profile kernels.
#
# Pair with:
#   make ARCH=um uml/fuzz
#   make ARCH=um O=/tmp/uml-fuzz -j$(nproc)
#
# The profile selects the fuzzing-oriented kernel config. This Umlfile provides
# a small hostfs guest environment and a stable ready marker for harness smoke
# runs. Fork-server pool testing is driven by the dedicated selftests and
# `umlctl pool` commands, not by an inline Umlfile fd setting.

schema_version = 1

[instance]
name = "uml-fuzz"
labels = { profile = "fuzz", purpose = "fuzz-harness" }

[kernel]
path = "${UML_KERNEL}"
backend = "seccomp"
append = []

[runtime]
mem = "128M"
ncpus = 1
root = "hostfs"

[network]
mode = "none"

[[init.phases]]
name = "ready"
cmd = """
if [ -x /usr/local/bin/fuzz-ready.sh ]; then
  exec /usr/local/bin/fuzz-ready.sh
fi
echo UML_FUZZ_READY
sleep infinity
"""

[debug]
strace = false
gdb = false
log_dir = ""
keep_running_on_failure = true
