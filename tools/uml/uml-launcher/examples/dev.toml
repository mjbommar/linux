# umlctl daily-driver Umlfile.
#
# Fast hostfs boot into an interactive shell. Run with --foreground when you
# want the shell on the current terminal:
#
#   UML_KERNEL=/tmp/uml-dev/linux \
#     umlctl up -f tools/uml/uml-launcher/examples/dev.toml --foreground

schema_version = 1

[instance]
name = "uml-dev"
labels = { profile = "dev", purpose = "daily-driver" }

[kernel]
path = "${UML_KERNEL}"
backend = "seccomp"
append = []

[runtime]
mem = "256M"
ncpus = 1
root = "hostfs"

[network]
mode = "none"

[[init.phases]]
name = "shell"
cmd = "exec /bin/sh -i"

[debug]
strace = false
gdb = false
log_dir = ""
keep_running_on_failure = true
