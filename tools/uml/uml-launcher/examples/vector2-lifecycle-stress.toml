# umlctl Umlfile - vector2 fd lifecycle stress.
#
# This is the live counterpart to the vector2 fd KUnit lifecycle tests:
# umlctl creates the host TAP, passes launcher-owned fd(s) to vector2,
# then the guest repeatedly drives the real netdev through
# `ip link set down` and `ip link set up`.
#
# Default run:
#   UML_KERNEL=/path/to/uml/linux \
#     umlctl gate loop -f tools/uml/uml-launcher/examples/vector2-lifecycle-stress.toml \
#       -W 1 -M 1 --timeout 1800 --pass-marker VECTOR2_LIFECYCLE_STRESS_OK
#
# Quick smoke:
#   UML_KERNEL=/path/to/uml/linux \
#     umlctl gate loop -f tools/uml/uml-launcher/examples/vector2-lifecycle-stress.toml \
#       -W 1 -M 1 --timeout 180 \
#       --sweep UML_VECTOR2_LIFECYCLE_CYCLES=25 \
#       --pass-marker VECTOR2_LIFECYCLE_STRESS_OK
#
# Inspect first:
#   UML_KERNEL=/path/to/uml/linux \
#     umlctl up -f tools/uml/uml-launcher/examples/vector2-lifecycle-stress.toml --dry-run

schema_version = 1

[instance]
name = "vector2-lifecycle-stress"
labels = { service = "network-lifecycle", driver = "vector2", transport = "fd", cycles = "10000" }

[kernel]
path = "${UML_KERNEL}"
backend = "seccomp"
append = []

[runtime]
mem = "512M"
ncpus = 1

[network]
mode = "tap"
driver = "vector2"
host_mode = "auto"
queues = 1
tap_name = "v2life0"
guest_ip = "10.92.0.2/24"
host_ip = "10.92.0.1/24"
gateway = "10.92.0.1"
nameservers = ["8.8.8.8", "1.1.1.1"]
masquerade_via = "auto"
ports = []

[env]
PATH = "/usr/bin:/bin:/sbin:/usr/sbin"
UML_VECTOR2_LIFECYCLE_CYCLES = "10000"

[[init.phases]]
name = "network-metadata"
cmd = "env | grep '^UMLCTL_NETWORK_' | sort; echo UMLCTL_NETDEV=$UMLCTL_NETDEV"

[[init.phases]]
name = "link-before"
cmd = "ip -d link show \"$UMLCTL_NETDEV\"; ip addr show \"$UMLCTL_NETDEV\""

[[init.phases]]
name = "lifecycle-stress"
timeout_secs = 1800
cmd = """
set -eu
dev="$UMLCTL_NETDEV"
cycles="${UML_VECTOR2_LIFECYCLE_CYCLES:-10000}"
case "$cycles" in
  ''|*[!0-9]*)
    echo "VECTOR2_LIFECYCLE_BAD_CYCLES value=$cycles"
    exit 1
    ;;
esac
if [ "$cycles" -le 0 ]; then
  echo "VECTOR2_LIFECYCLE_BAD_CYCLES value=$cycles"
  exit 1
fi
command -v ethtool >/dev/null 2>&1 || {
  echo "VECTOR2_LIFECYCLE_NO_ETHTOOL"
  exit 1
}
get_stat() {
  ethtool -S "$dev" 2>/dev/null |
    sed -n "s/^[[:space:]]*$1:[[:space:]]*//p" |
    tail -n 1
}
before_open="$(get_stat open_attempts)"
before_close="$(get_stat closes)"
if [ -z "$before_open" ] || [ -z "$before_close" ]; then
  echo "VECTOR2_LIFECYCLE_MISSING_COUNTERS before_open=$before_open before_close=$before_close"
  ethtool -S "$dev" || true
  exit 1
fi
i=0
while [ "$i" -lt "$cycles" ]; do
  ip link set "$dev" down || {
    echo "VECTOR2_LIFECYCLE_DOWN_FAIL iter=$i"
    exit 1
  }
  ip link set "$dev" up || {
    echo "VECTOR2_LIFECYCLE_UP_FAIL iter=$i"
    exit 1
  }
  i=$((i + 1))
  if [ $((i % 1000)) -eq 0 ] || [ "$i" -eq "$cycles" ]; then
    echo "VECTOR2_LIFECYCLE_PROGRESS cycles=$i"
  fi
done
after_open="$(get_stat open_attempts)"
after_close="$(get_stat closes)"
if [ -z "$after_open" ] || [ -z "$after_close" ]; then
  echo "VECTOR2_LIFECYCLE_MISSING_COUNTERS after_open=$after_open after_close=$after_close"
  ethtool -S "$dev" || true
  exit 1
fi
open_delta=$((after_open - before_open))
close_delta=$((after_close - before_close))
if [ "$open_delta" -lt "$cycles" ] || [ "$close_delta" -lt "$cycles" ]; then
  echo "VECTOR2_LIFECYCLE_COUNTER_MISMATCH cycles=$cycles open_delta=$open_delta close_delta=$close_delta before_open=$before_open after_open=$after_open before_close=$before_close after_close=$after_close"
  ethtool -S "$dev" || true
  exit 1
fi
echo "VECTOR2_LIFECYCLE_COUNTERS cycles=$cycles open_delta=$open_delta close_delta=$close_delta before_open=$before_open after_open=$after_open before_close=$before_close after_close=$after_close"
"""

[[init.phases]]
name = "gateway-after"
cmd = "ping -c 3 \"$UMLCTL_GATEWAY\""
timeout_secs = 20

[[init.phases]]
name = "stats-after"
cmd = "ethtool -S \"$UMLCTL_NETDEV\""

[[init.phases]]
name = "ready"
cmd = "echo VECTOR2_LIFECYCLE_STRESS_OK"

[debug]
strace = false
gdb = false
gdb_port = 5678
log_dir = ""
keep_running_on_failure = false
